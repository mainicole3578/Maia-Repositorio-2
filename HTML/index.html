<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex | UNLZ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
      
        <link rel="stylesheet" href="../CSS/estilos.css">
</head>

<body> 
       <header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-controller"></i>
                Pokédex UNLZ
            </a>
                     Pokédex UNLZ
                </a>
              <button class = "navbar-toggler" type="button" data-bs-target = "#menuPrincipal" aria-controls ="menuPrincipal" 
                aria-expanded="false" aria-label1="abrir menu"> 
                <span class = "navbar-toggler-icon"></span>
              </button>

              <div class = "collapse navbar-collapse" id="menuPrincipal">
                <ul class ="navbar-nav ms-auto">
                    <li class = "nav-item">
                        <a class = "nav-link active" href = "#" > inicio </a>
                    </li>
                </ul>
              </div>
            </div>
        </nav>
    </header>

    <main>
      <section class = "py-5">
         <div class = "container text-center">
            <h1 class = "fw-bold">Pokédex</h1>
            <p class = "lead"> Busca informacion sobre tu pokemon favorito </p>
         </div>
      </section>
        <section class ="pb-4">
            <div class = "container">
                <div class = "row justify-content-center">
                    <div class = "col-12 col-md-8 col-lg-6">
                        <form id ="formularioBusqueda">
                            <label1 for="busqueda" class = "form-label fw-bold"> Buscar Pokemon </label1>
                            <div class = "input-group" 
                             <input
                                    type="text"
                                    id="busqueda"
                                    class="form-control"
                                    placeholder="Nombre o ID del Pokémon">
                                <button type="submit" class = "btn btn primary">
                                <i class = "bi bi search"></i>
                                Buscar
                            </button>
                        </form>
                        <div class = "text-center mt-3">
                            <button id ="btnVolver" class = "btn btn-secondary">
                                <i class ="bi bi-arrow-counterClockwise"></i>
                                Volver a la lista
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section>
             <div class = "container text-center">
                <div id ="spinner" class = "spinner-border text-primary d.none" role="status">
                    <span class = "visually-hidden">Cargando...</span>
                </div>
               <p id="textoCarga" class = "d-none" >Cargando Pokemon</p>
             </div>
        </section>
        <section class ="py-5">
         <div class = "container">
            <h2 class = "text-center mb-4"> Pokemon </h2>
            <div id ="contenerdorPokemon" class = "row g-4"> </div>
         </div>
        </section>  
    </main>
    <footer class = "bg-dark text-white text-center py4">
         <div class = "container">
            <p class ="mb-o"> Pokemon </p>
         </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script type="module" src="../js/app.js"></script>
</body>
</html>
